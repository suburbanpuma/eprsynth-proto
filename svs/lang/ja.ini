# svs/lang/ja.ini
[language]
name = ja

[types]
vowel       = a i u e o N
nasal       = m my n ny
trill       =
fricative   = s sh z f
approximant = w y
aspirate    = h hy
plosive     = k g t d p b ts ch j r ry ky py dy ty gy by
